name: Deploy pipeline

on:
  workflow_call:
    inputs:
      pipelines_json:
        description: "JSON array of pipeline names"
        required: true
        type: string
      hf_token_pipelines_json:
        description: "JSON array of pipelines requiring HF_TOKEN"
        required: false
        default: "[]"
        type: string
      organization:
        description: "Picsellia organization name"
        required: true
        type: string
      environment_name:
        description: "Picsellia environment (STAGING|PROD)"
        required: true
        type: string
      bump:
        description: "Version bump (rc|final|...)"
        required: true
        type: string
      runs_on:
        description: "Runner type (ubuntu-latest | self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      PXL_API_TOKEN:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      HF_TOKEN:
        required: false

jobs:
  deploy-env:
    if: ${{ inputs.pipelines_json != '' && inputs.pipelines_json != '[]' }}
    runs-on: ${{ inputs.runs_on }}

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(inputs.pipelines_json) }}

    env:
      ORGANIZATION: ${{ inputs.organization }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      BUMP: ${{ inputs.bump }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure uv is installed
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            echo "uv already installed"
          else
            echo "Installing uv..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Sync project dependencies
        run: uv sync

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Deploy one pipeline (no HF)
        if: ${{ !contains(fromJson(inputs.hf_token_pipelines_json), matrix.pipeline) }}
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          uv run bash scripts/deploy_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN" \
            --bump "$BUMP"

      - name: Deploy one pipeline (with HF)
        if: ${{ contains(fromJson(inputs.hf_token_pipelines_json), matrix.pipeline) }}
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "❌ HF_TOKEN required for ${{ matrix.pipeline }} but not available"
            exit 1
          fi

          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          uv run bash scripts/deploy_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN" \
            --bump "$BUMP" \
            --hf-token "$HF_TOKEN"
