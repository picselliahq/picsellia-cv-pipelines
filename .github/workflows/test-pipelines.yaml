name: Test pipelines

on:
  pull_request:
    branches:
      - main

env:
  ORGANIZATION: test-account
  ENVIRONMENT: STAGING

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-pipeline-changes.yaml

  check-gpu-runner:
    name: Check GPU runner availability
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gpu_processing_pipelines != '[]' || needs.detect-changes.outputs.training_pipelines != '[]' }}
    outputs:
      gpu_online: ${{ steps.check.outputs.gpu_online }}
    steps:
      - name: Check if any self-hosted GPU runner is online
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Repo-level runners (change to org-level endpoint if you use org runners)
            const res = await github.request('GET /repos/{owner}/{repo}/actions/runners', { owner, repo });

            const runners = res.data.runners || [];
            const gpuRunners = runners.filter(r =>
              r.labels?.some(l => l.name === 'gpu') && r.status === 'online'
            );

            core.info(`Total runners: ${runners.length}`);
            core.info(`Online GPU runners: ${gpuRunners.length}`);

            core.setOutput('gpu_online', gpuRunners.length > 0 ? 'true' : 'false');

      - name: Explain if GPU is offline
        if: ${{ steps.check.outputs.gpu_online != 'true' }}
        run: |
          echo "⚠️ No ONLINE self-hosted runner with label 'gpu' found."
          echo "➡️ GPU jobs will be skipped (no waiting queue)."


  test-cpu-processing-pipelines:
    needs: detect-changes
    runs-on: ubuntu-latest

    if: ${{ needs.detect-changes.outputs.processing_pipelines != '' && needs.detect-changes.outputs.processing_pipelines != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.detect-changes.outputs.processing_pipelines) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Sync project dependencies
        run: uv sync

      - name: Run CPU-safe processing pipeline tests
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          echo "CPU PIPELINE=${{ matrix.pipeline }}"
          echo "ORG=$ORGANIZATION"
          echo "ENV=$ENVIRONMENT"
          echo "PICSELLIA_CONFIG_DIR=$PICSELLIA_CONFIG_DIR"

          uv run bash scripts/test_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN"

  test-gpu-processing-pipelines:
    needs:
      - detect-changes
      - check-gpu-runner
    runs-on: self-hosted
    if: ${{ needs.detect-changes.outputs.gpu_processing_pipelines != '' &&
            needs.detect-changes.outputs.gpu_processing_pipelines != '[]' &&
            needs.check-gpu-runner.outputs.gpu_online == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.detect-changes.outputs.gpu_processing_pipelines) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure uv is installed
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            echo "✅ uv already available at: $(command -v uv)"
          else
            echo "⬇️ Installing uv via curl..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Sync project dependencies
        run: uv sync

      - name: Run GPU processing pipeline tests
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          echo "GPU PIPELINE=${{ matrix.pipeline }}"
          echo "ORG=$ORGANIZATION"
          echo "ENV=$ENVIRONMENT"
          echo "PICSELLIA_CONFIG_DIR=$PICSELLIA_CONFIG_DIR"

          uv run bash scripts/test_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN"

  test-training-pipelines:
    needs:
      - detect-changes
      - check-gpu-runner
    runs-on: self-hosted
    if: ${{ needs.detect-changes.outputs.training_pipelines != '' &&
            needs.detect-changes.outputs.training_pipelines != '[]' &&
            needs.check-gpu-runner.outputs.gpu_online == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.detect-changes.outputs.training_pipelines) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure uv is installed
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            echo "✅ uv already available at: $(command -v uv)"
          else
            echo "⬇️ Installing uv via curl..."
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Sync project dependencies
        run: uv sync

      - name: Run training pipeline tests
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          echo "TRAINING PIPELINE=${{ matrix.pipeline }}"
          echo "ORG=$ORGANIZATION"
          echo "ENV=$ENVIRONMENT"
          echo "PICSELLIA_CONFIG_DIR=$PICSELLIA_CONFIG_DIR"

          uv run bash scripts/test_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN"

  deploy-cpu-processing:
    needs:
      - detect-changes
      - test-cpu-processing-pipelines
    if: ${{ needs.test-cpu-processing-pipelines.result == 'success' }}
    uses: ./.github/workflows/deploy-env.yaml
    with:
      pipelines_json: ${{ needs.detect-changes.outputs.processing_pipelines }}
      organization: test-account
      environment_name: STAGING
      bump: rc
      runs_on: ubuntu-latest
    secrets:
      PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-gpu-processing:
    needs:
      - detect-changes
      - test-gpu-processing-pipelines
      - check-gpu-runner
    if: ${{ needs.test-gpu-processing-pipelines.result == 'success' &&
            needs.check-gpu-runner.outputs.gpu_online == 'true' }}
    uses: ./.github/workflows/deploy-env.yaml
    with:
      pipelines_json: ${{ needs.detect-changes.outputs.gpu_processing_pipelines }}
      organization: test-account
      environment_name: STAGING
      bump: rc
      runs_on: self-hosted
    secrets:
      PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-training-processing:
    needs:
      - detect-changes
      - test-training-pipelines
      - check-gpu-runner
    if: ${{ needs.test-training-pipelines.result == 'success' &&
            needs.check-gpu-runner.outputs.gpu_online == 'true' }}
    uses: ./.github/workflows/deploy-env.yaml
    with:
      pipelines_json: ${{ needs.detect-changes.outputs.training_pipelines }}
      organization: test-account
      environment_name: STAGING
      bump: rc
      runs_on: self-hosted
    secrets:
      PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
