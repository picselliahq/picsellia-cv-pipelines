name: CV Pipelines tests (matrix)

on:
  push:
    branches:
      - feat/27-use-assets-ids-in-dataset-processing

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pipelines: ${{ steps.build-matrix.outputs.pipelines }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which pipelines changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bounding_box_cropper:
              - 'pipelines/bounding_box_cropper/**'
              - 'tests/bounding_box_cropper/**'
            yolov8:
              - 'pipelines/yolov8/**'
              - 'tests/yolov8/**'
            dataset_tiler:
              - 'pipelines/dataset_tiler/**'
              - 'tests/dataset_tiler/**'

      - name: Build matrix from changed pipelines
        id: build-matrix
        run: |
          PIPELINES=()

          if [ "${{ steps.changes.outputs.bounding_box_cropper }}" = "true" ]; then
            PIPELINES+=("\"bounding_box_cropper\"")
          fi

          if [ "${{ steps.changes.outputs.yolov8 }}" = "true" ]; then
            PIPELINES+=("\"yolov8\"")
          fi

          if [ "${{ steps.changes.outputs.dataset_tiler }}" = "true" ]; then
            PIPELINES+=("\"dataset_tiler\"")
          fi

          # Fallback if nothing matched
          if [ ${#PIPELINES[@]} -eq 0 ]; then
            PIPELINES+=("\"bounding_box_cropper\"")
          fi

          JSON="[$(IFS=,; echo "${PIPELINES[*]}")]"
          echo "pipelines=$JSON" >> "$GITHUB_OUTPUT"

  test-pipelines:
    needs: detect-changes
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.detect-changes.outputs.pipelines) }}

    env:
      ORGANIZATION: test-account
      ENVIRONMENT: STAGING

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Sync project dependencies
        run: uv sync

      - name: Run pipeline tests for one pipeline
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          echo "PIPELINE=${{ matrix.pipeline }}"

          uv run bash scripts/test_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN"
