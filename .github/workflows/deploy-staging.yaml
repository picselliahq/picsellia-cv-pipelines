name: CV Pipelines deploy (staging, on main)

on:
  push:
    branches:
      - main

jobs:
  detect-changed-pipelines:
    runs-on: ubuntu-latest

    outputs:
      pipelines: ${{ steps.build-matrix.outputs.pipelines }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect pipeline changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bounding_box_cropper:
              - 'pipelines/bounding_box_cropper/**'
              - 'tests/bounding_box_cropper/**'
            dataset_tiler:
              - 'pipelines/dataset_tiler/**'
              - 'tests/dataset_tiler/**'

      - name: Build matrix from changed pipelines
        id: build-matrix
        run: |
          PIPELINES=()

          if [ "${{ steps.changes.outputs.bounding_box_cropper }}" = "true" ]; then
            PIPELINES+=("\"bounding_box_cropper\"")
          fi

          if [ "${{ steps.changes.outputs.dataset_tiler }}" = "true" ]; then
            PIPELINES+=("\"dataset_tiler\"")
          fi

          if [ ${#PIPELINES[@]} -eq 0 ]; then
            echo "No pipelines to deploy to staging."
            echo 'pipelines=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON="[$(IFS=,; echo "${PIPELINES[*]}")]"
          echo "pipelines=$JSON" >> "$GITHUB_OUTPUT"
          echo "Matrix pipelines = $JSON"

  deploy-to-staging:
    needs: detect-changed-pipelines
    runs-on: ubuntu-latest

    if: ${{ needs.detect-changed-pipelines.outputs.pipelines != '[]' && needs.detect-changed-pipelines.outputs.pipelines != '' }}

    strategy:
      fail-fast: false
      matrix:
        pipeline: ${{ fromJson(needs.detect-changed-pipelines.outputs.pipelines) }}

    env:
      ORGANIZATION: test-account
      ENVIRONMENT: STAGING
      BUMP: rc

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Sync project dependencies
        run: uv sync

      - name: Login to Docker Hub as picsellia
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Deploy one pipeline to STAGING
        env:
          PXL_API_TOKEN: ${{ secrets.PXL_API_TOKEN_STAGING }}
        run: |
          PICSELLIA_CONFIG_DIR="$RUNNER_TEMP/picsellia_cfg"
          mkdir -p "$PICSELLIA_CONFIG_DIR"

          echo "Deploying to STAGING: pipeline='${{ matrix.pipeline }}'"
          echo "ORG=$ORGANIZATION"
          echo "ENV=$ENVIRONMENT"
          echo "BUMP=$BUMP"

          uv run bash scripts/deploy_pipelines.sh \
            --pipeline "${{ matrix.pipeline }}" \
            --organization "$ORGANIZATION" \
            --env "$ENVIRONMENT" \
            --token "$PXL_API_TOKEN" \
            --bump "$BUMP"
