name: Detect CV Pipelines changes

on:
  workflow_call:
    outputs:
      pipelines:
        description: "JSON array of pipelines that changed (top-level dir names under pipelines/ or tests/)"
        value: ${{ jobs.detect.outputs.pipelines }}

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      pipelines: ${{ steps.build-matrix.outputs.pipelines }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed files under pipelines/ and tests/
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pipelines:
              - 'pipelines/**'
              - 'tests/**'

      - name: Build pipelines JSON from changed files (script)
        id: build-matrix
        env:
          CHANGED_FLAG: ${{ steps.changes.outputs.pipelines }}
        run: |
          echo "pipelines_files from dorny:"
          printf '%s\n' "${{ steps.changes.outputs.pipelines_files }}"

          printf '%s\n' "${{ steps.changes.outputs.pipelines_files }}" \
            | .github/scripts/build_pipelines_matrix.sh
