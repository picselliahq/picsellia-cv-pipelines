name: Detect CV Pipelines changes

on:
  workflow_call:
    outputs:
      pipelines:
        description: "JSON array of pipelines that changed"
        value: ${{ jobs.detect.outputs.pipelines }}

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      pipelines: ${{ steps.build-matrix.outputs.pipelines }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed pipelines
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bounding_box_cropper:
              - 'pipelines/bounding_box_cropper/**'
              - 'tests/bounding_box_cropper/**'
            dataset_tiler:
              - 'pipelines/dataset_tiler/**'
              - 'tests/dataset_tiler/**'
            # add more pipelines here as you add them:
            # yolov8_pre_annotation:
            #   - 'pipelines/yolov8/**'
            #   - 'tests/yolov8/**'

      - name: Build matrix from changed pipelines
        id: build-matrix
        shell: bash
        run: |
          PIPELINES=()

          if [ "${{ steps.changes.outputs.bounding_box_cropper }}" = "true" ]; then
            PIPELINES+=("\"bounding_box_cropper\"")
          fi

          if [ "${{ steps.changes.outputs.dataset_tiler }}" = "true" ]; then
            PIPELINES+=("\"dataset_tiler\"")
          fi

          # TODO: add more if-blocks here when you add new pipelines

          if [ ${#PIPELINES[@]} -eq 0 ]; then
            echo "No pipelines changed."
            echo 'pipelines=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON="[$(IFS=,; echo "${PIPELINES[*]}")]"
          echo "Computed matrix: $JSON"
          echo "pipelines=$JSON" >> "$GITHUB_OUTPUT"
