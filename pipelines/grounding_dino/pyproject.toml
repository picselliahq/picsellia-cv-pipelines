[project]
name = "grounding_dino"
version = "0.1.0"
description = "Picsellia processing pipeline"
requires-python = ">=3.10,<3.12"

dependencies = [
    "poetry",
    "picsellia-cv-engine",
    "picsellia-pipelines-cli",
    "setuptools>=70.2.0",
    "timm<=1.0.10",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "opencv-python",
    "groundingdino",
    "scikit-learn"
]

[tool.uv.extra-build-dependencies]
groundingdino = ["setuptools", "torch"]

[tool.uv.sources]
picsellia-cv-engine = { git = "https://github.com/picselliahq/picsellia-cv-engine.git", rev = "feat/unified-pipeline-context-runner" }
picsellia-pipelines-cli = { git = "https://github.com/picselliahq/picsellia-pipelines-cli.git", rev = "main" }
groundingdino = { git = "https://github.com/IDEA-Research/GroundingDINO.git", rev = "main" }

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
