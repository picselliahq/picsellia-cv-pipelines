[project]
name = "grounding_dino"
version = "0.1.0"
description = "Picsellia processing pipeline"
requires-python = ">=3.10,<3.12"

dependencies = [
    "poetry",
    "picsellia-cv-engine",
    "picsellia-pipelines-cli",
    "setuptools>=70.2.0",
    "timm<=1.0.10",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "opencv-python",
    "transformers==4.41.2",
    "groundingdino-py"
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
