[metadata]
name = "clip-training"
version = "1.0.3-rc"
description = "Training pipeline using YOLO and Ultralytics."
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:TrainingHyperParameters"

[docker]
image_name = "picsellia/training-clip"
image_tag = "1.0.3-rc"

[model_version]
name = "v1"
origin_name = "CLIP"
framework = "PYTORCH"
inference_type = "OBJECT_DETECTION"
