[metadata]
name = "training"
version = "1.0.2"
description = "Training pipeline using RT DETR and HuggingFace."
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:TrainingHyperParameters"

[docker]
image_name = "picsellia/training-rt-detr"
image_tag = "1.0.2"

[model_version]
name = "v1"
origin_name = "RT-DETR"
framework = "PYTORCH"
inference_type = "OBJECT_DETECTION"
