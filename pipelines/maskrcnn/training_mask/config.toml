[metadata]
name = "maskrcnn-mask-training"
version = "1.0.0"
description = "Training pipeline using Mask R-CNN and PyTorch/TorchVision on MASK (RLE) datasets."
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:TrainingHyperParameters"

[docker]
image_name = "picsellia/training-maskrcnn-mask"
image_tag = "1.0.0"

[model_version]
name = "v1"
origin_name = "Mask-RCNN-Mask"
framework = "PYTORCH"
inference_type = "MASK"
