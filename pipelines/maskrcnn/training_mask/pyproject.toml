[project]
name = "training"
version = "0.1.0"
description = "Mask R-CNN training pipeline"
requires-python = ">=3.10"

dependencies = [
    # DatasetVersion type MASK is only known by the SDK from 6.33.0 (6.29.0 fails
    # to parse a MASK dataset version with a pydantic enum error).
    "picsellia>=6.33.0",
    "picsellia-pipelines-cli",
    "picsellia-cv-engine",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pycocotools",
    "opencv-python>=4.11.0.86",
]
