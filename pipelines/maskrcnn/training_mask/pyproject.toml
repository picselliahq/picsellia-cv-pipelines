[project]
name = "training"
version = "0.1.0"
description = "Mask R-CNN training pipeline"
requires-python = ">=3.10"

dependencies = [
    # MASK support in the SDK: the MASK dataset version type is unknown in 6.29.0
    # (pydantic enum error when loading it), and Experiment.add_evaluation(masks=...)
    # needed to push mask evaluations is available in 6.37.0 (absent in 6.33.0).
    "picsellia>=6.37.0",
    "picsellia-pipelines-cli",
    "picsellia-cv-engine",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pycocotools",
    # Not used by this pipeline, but picsellia-cv-engine imports cv2 (core/services/
    # utils/annotations.py) without declaring opencv-python: keep it installed.
    "opencv-python>=4.11.0.86",
]
