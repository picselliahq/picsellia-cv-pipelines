[project]
name = "YOLOv8_OBB"
version = "0.1.0"
description = "YoloV8 training pipeline"
requires-python = ">=3.10"

dependencies = [
    "picsellia-pipelines-cli",
    "picsellia-cv-engine",

    # Make PyTorch explicit; do not let ultralytics pull latest torch.
    "torch==2.7.1",
    "torchvision==0.22.1",

    "ultralytics>=8.3.145",
    "opencv-python",
    "numpy",
    "pyyaml",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true