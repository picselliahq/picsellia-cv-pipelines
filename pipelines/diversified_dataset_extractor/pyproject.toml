[project]
name = "diversified_dataset_extractor"
version = "0.1.0"
description = "This Picsellia pipeline uses image embeddings to extract a diverse subset of images from a large dataset. By measuring visual similarity through neural network embeddings, it selects images that maximize diversity while maintaining representation of your data distribution. Extended documentation available here: https://github.com/picselliahq/picsellia-cv-pipelines/blob/main/pipelines/diversified_dataset_extractor/README.md "
requires-python = ">=3.10,<3.12"

dependencies = [
    "picsellia-cv-engine",
    "picsellia-pipelines-cli",
    "Pillow>=9.0.0, <10.0.0",
    "open_clip_torch==2.24.0",
    "requests>=2.32.3, <3.0.0",
    "scipy>=1.14.0, <2.0.0",
    "tqdm>=4.66.0, <5.0.0",
]
