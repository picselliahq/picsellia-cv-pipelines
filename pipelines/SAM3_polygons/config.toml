[metadata]
name = "SAM3_polygons"
version = "1.0.2"
description = "This Dataset Processing provides polygons pre-labeling with SAM3"
type = "PRE_ANNOTATION"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:ProcessingParameters"

[docker]
image_name = "picsellia/sam3_polygons"
image_tag = "latest"
cpu = 4
gpu = 1
