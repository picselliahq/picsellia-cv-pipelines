[metadata]
name = "yoloX/training"
version = "1.0.0"
description = "Training pipeline using YOLOX anchor-free object detection."
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:TrainingHyperParameters"

[docker]
image_name = "picsellia/training-yolox"
image_tag = "1.0.0"

[model_version]
name = "v1"
origin_name = "YOLOX"
framework = "PYTORCH"
inference_type = "OBJECT_DETECTION"
