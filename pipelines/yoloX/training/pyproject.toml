[project]
name = "yoloX-training"
version = "0.1.0"
description = "YOLOX training pipeline"
requires-python = ">=3.10"

dependencies = [
    "picsellia-pipelines-cli",
    "picsellia-cv-engine",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "pycocotools",
    "onnx>=1.15.0",
    "loguru",
    "imgaug",
    "tabulate",
    "packaging",
    "picsellia>=6.30.0",
    "psutil",
    "tensorboard",
    "tqdm",
    "matplotlib",
    "thop",
    "ninja>=1.13.0",
    "onnxscript>=0.5.0",
    "onnxruntime>=1.15.0",
]

# picsellia-cv-engine pins numpy<2, but on Python 3.13+ that forces onnx 1.19 with
# ml-dtypes 0.4.1, and `import onnx` then fails (missing ml_dtypes.float4_e2m1fn).
# ml-dtypes>=0.5 needs numpy>=2.1, hence the override.
[tool.uv]
override-dependencies = ["numpy>=2.1"]

# Pin torch on a CUDA 12.8 build: required for Blackwell GPUs (RTX PRO 6000, sm_120).
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
