[project]
name = "paddle_ocr"
version = "0.1.0"
description = "Picsellia processing pipeline"
requires-python = ">=3.10,<3.11"

dependencies = [
    "picsellia-cv-engine",
    "picsellia-pipelines-cli",
    "numpy==1.26.4",
    "imutils==0.5.4",
    "opencv-contrib-python==4.6.0.66",
    "scipy==1.14.0",
    "shapely==2.0.4",
    "pyclipper==1.3.0.post5",
    "scikit-image==0.24.0",
    "imgaug==0.4.0",
    "lmdb==1.5.1",
    "black==24.4.2",
    "rapidfuzz==3.9.4",
    "PyYAML==6.0.1",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "tqdm",
    "requests",
]

[tool.uv.sources]
picsellia-cv-engine = { git = "https://github.com/picselliahq/picsellia-cv-engine.git", rev = "main" }
picsellia-pipelines-cli = { git = "https://github.com/picselliahq/picsellia-pipelines-cli.git", rev = "main" }
