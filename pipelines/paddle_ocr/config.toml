[metadata]
name = "paddle_ocr"
version = "1.0.14-rc"
description = "This pipeline processes data for X."
type = "TRAINING"

[execution]
pipeline_script = "pipeline.py"
requirements_file = "pyproject.toml"
parameters_class = "utils/parameters.py:PaddleOCRHyperParameters"

[docker]
image_name = "picsellia/training-paddle-ocr"
image_tag = "1.0.14-rc"

[model_version]
name = "paddle_ocr"
origin_name = "PaddleOCR"
framework = "NOT_CONFIGURED"
inference_type = "OBJECT_DETECTION"
