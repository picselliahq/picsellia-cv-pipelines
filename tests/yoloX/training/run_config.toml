override_outputs = true

[job]
type = "TRAINING"

[input.model_version]
id = "@model_version"

[input.train_dataset_version]
id = "@dataset_version"

[output.experiment]
name = "yoloX"
project_name = "test_models"

[hyperparameters]
architecture = "yolox-s"
epochs = 10
batch_size = 8
image_size = 640
learning_rate = 0.01
eval_interval = 2
enable_weather_transform = false
evaluation_batch_size = 8

[export_parameters]
enable_dynamic_axis = false
