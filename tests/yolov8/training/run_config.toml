override_outputs = true

[job]
type = "TRAINING"

[hyperparameters]
batch_size = 8
close_mosaic = 0
device = "cuda:0"
epochs = 2
export_format = "onnx"
image_size = 640
patience = 100
save_period = 100
seed = 0
train_set_split_ratio = 0.8
validate = false

[input.train_dataset_version]
id = "@dataset_version"

[input.model_version]
id = "@model_version"

[output.experiment]
name = "yolov8_exp1"
project_name = "test_models"
