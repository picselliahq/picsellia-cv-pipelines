override_outputs = true

[job]
type = "DATASET_VERSION_CREATION"

[inputs]
output_dataset_version_name = "Video_frames"
datalake = "@datalake"

[input.dataset_version]
id = "@dataset_version"

[parameters]
# keyframes come from video annotations, which the CI fixture videos do not have
extract_only_keyframes = false
extract_every_n_frames = 50
