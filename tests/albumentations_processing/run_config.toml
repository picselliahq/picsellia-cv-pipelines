override_outputs = true

[job]
type = "DATASET_VERSION_CREATION"

[parameters]
add_noise = false
data_tag = "processed"
datalake = "default"
rotate_max = 45
rotate_min = -45
rotate_prob = 1.0
scale_max = 1.1
scale_min = 0.9

[input.dataset_version]
id = "@dataset_version"

[inputs]
datalake = "@datalake"
target_version_name = "test_albumentations_processing"
