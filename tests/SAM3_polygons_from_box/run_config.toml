override_outputs = true

[job]
type = "DATASET_VERSION_CREATION"

[inputs]
output_dataset_version_name = "polygons-from-boxes"

[parameters]
threshold = 0.3
mask_threshold = 0.5
min_area = 10.0
fallback_to_bbox_polygon = true
annotation_mode = "replace"

[input.dataset_version]
id = "@dataset_version"
